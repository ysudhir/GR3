<title>JARO llm-wiki</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F7F8F6;
    --surface: #FFFFFF;
    --ink: #1B2620;
    --ink-soft: #47564E;
    --ink-faint: #7E8B84;
    --line: #D8DED8;
    --line-strong: #B9C2BB;
    --accent: #1E6E58;
    --accent-ink: #175D4A;
    --accent-soft: #E4EFE9;
    --warn: #9A6B10;
    --warn-soft: #F5ECD8;
    --alert: #A93B2E;
    --alert-soft: #F6E9E6;
    --code-bg: #EFF2EE;
    --serif: "Spectral", Georgia, serif;
    --sans: "Public Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121714; --surface: #1A211C; --ink: #E5ECE6; --ink-soft: #A5B2A9;
      --ink-faint: #6E7B73; --line: #2C352F; --line-strong: #41503F;
      --accent: #4FBF9C; --accent-ink: #5ECDA9; --accent-soft: #1D3229;
      --warn: #D9A544; --warn-soft: #34290F; --alert: #E07862; --alert-soft: #3A241F;
      --code-bg: #161D18;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121714; --surface: #1A211C; --ink: #E5ECE6; --ink-soft: #A5B2A9;
    --ink-faint: #6E7B73; --line: #2C352F; --line-strong: #41503F;
    --accent: #4FBF9C; --accent-ink: #5ECDA9; --accent-soft: #1D3229;
    --warn: #D9A544; --warn-soft: #34290F; --alert: #E07862; --alert-soft: #3A241F;
    --code-bg: #161D18;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.55; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent-ink); }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 22px; border-bottom: 2px solid var(--ink);
    background: var(--surface); position: sticky; top: 0; z-index: 20;
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; }
  .wordmark .jaro { font-family: var(--mono); font-weight: 500; font-size: 1.25rem; letter-spacing: 0.14em; color: var(--accent-ink); }
  .wordmark .sub { font-size: 0.78rem; color: var(--ink-soft); }
  .proto-badge {
    font-family: var(--mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em;
    border: 1px solid var(--line-strong); color: var(--ink-faint); padding: 3px 8px; border-radius: 3px;
  }
  .topnav { margin-left: auto; display: flex; gap: 6px; }
  .topnav button {
    background: none; border: 1px solid transparent; padding: 7px 14px; border-radius: 4px;
    font-weight: 600; font-size: 0.86rem; color: var(--ink-soft);
  }
  .topnav button.active { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
  .topnav .count {
    display: inline-block; min-width: 18px; text-align: center; margin-left: 6px;
    background: var(--warn-soft); color: var(--warn); border-radius: 9px; font-size: 0.7rem; padding: 1px 5px;
    font-family: var(--mono);
  }

  /* ---------- layout ---------- */
  .shell { display: flex; min-height: calc(100vh - 60px); max-width: 1440px; margin: 0 auto; }
  .sidebar {
    width: 285px; flex: none; border-right: 1px solid var(--line); padding: 18px 14px 40px;
    background: var(--ground);
  }
  .main { flex: 1; min-width: 0; padding: 26px 34px 80px; }
  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    .sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .main { padding: 20px 16px 60px; }
  }

  /* ---------- sidebar tree ---------- */
  .side-label {
    font-family: var(--mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.11em;
    color: var(--ink-faint); margin: 14px 8px 6px;
  }
  details.region { margin-bottom: 2px; }
  details.region > summary {
    list-style: none; cursor: pointer; padding: 7px 8px; font-weight: 700; font-size: 0.85rem;
    display: flex; align-items: center; gap: 8px; border-radius: 4px;
  }
  details.region > summary:hover { background: var(--accent-soft); }
  details.region > summary::before { content: "▸"; font-size: 0.7rem; color: var(--ink-faint); transition: transform 0.12s; }
  details.region[open] > summary::before { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { details.region > summary::before { transition: none; } }
  .region-count { margin-left: auto; font-family: var(--mono); font-size: 0.68rem; color: var(--ink-faint); font-weight: 400; }
  .country { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 6px; }
  .country-head { display: flex; align-items: center; gap: 7px; padding: 5px 6px; font-size: 0.84rem; font-weight: 600; color: var(--ink-soft); }
  .doc-link {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    background: none; border: none; padding: 4px 6px 4px 18px; border-radius: 4px;
    font-size: 0.8rem; color: var(--ink-soft); font-family: var(--mono);
  }
  .doc-link:hover { background: var(--accent-soft); color: var(--accent-ink); }
  .doc-link.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.effective { background: var(--accent); }
  .dot.review { background: var(--warn); }
  .dot.draft { background: var(--ink-faint); }

  /* ---------- pills & chips ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 12px;
    font-family: var(--mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500;
    border: 1px solid;
  }
  .pill.effective { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent); }
  .pill.review { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
  .pill.draft { color: var(--ink-faint); background: var(--code-bg); border-color: var(--line-strong); }
  .pill.changes { color: var(--alert); background: var(--alert-soft); border-color: var(--alert); }
  .pill.approved { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent); }
  .chip {
    display: inline-block; font-family: var(--mono); font-size: 0.7rem; padding: 2px 8px;
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px; color: var(--ink-soft);
    white-space: nowrap;
  }
  .chip.anchor { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- doc page ---------- */
  .crumb { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-faint); margin-bottom: 14px; }
  .crumb b { color: var(--ink-soft); font-weight: 500; }
  .doc-head { border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 20px; }
  .doc-head h1 { font-family: var(--serif); font-weight: 600; font-size: 1.7rem; line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
  .doc-head .idrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .gr3-id { font-family: var(--mono); font-size: 0.8rem; color: var(--accent-ink); }
  .view-toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; margin-left: auto; }
  .view-toggle button { background: var(--surface); border: none; padding: 6px 14px; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); }
  .view-toggle button.on { background: var(--accent); color: var(--surface); }
  :root[data-theme="dark"] .view-toggle button.on { color: #10231C; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .view-toggle button.on { color: #10231C; } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; margin-bottom: 18px; }
  .panel h2 {
    margin: 0 0 12px; font-size: 0.72rem; font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.11em; color: var(--ink-faint); font-weight: 500;
  }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 24px; }
  .facts dt { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); font-family: var(--mono); margin-bottom: 2px; }
  .facts dd { margin: 0; font-size: 0.88rem; color: var(--ink); font-weight: 500; }
  .facts .wide { grid-column: 1 / -1; }

  .planes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .planes { grid-template-columns: 1fr; } }
  .plane h3 { margin: 0 0 8px; font-size: 0.78rem; font-weight: 700; }
  .plane p { margin: 0; font-size: 0.86rem; color: var(--ink-soft); }
  pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; overflow-x: auto; font-size: 0.74rem; line-height: 1.55; margin: 0;
    font-family: var(--mono); color: var(--ink);
  }
  .sync-note { font-family: var(--mono); font-size: 0.68rem; color: var(--accent-ink); margin-top: 10px; }

  table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  th { text-align: left; font-family: var(--mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-faint); font-weight: 500; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line-strong); }
  td { padding: 8px 14px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-soft); }
  td.k { color: var(--ink); font-weight: 600; }
  .tbl-wrap { overflow-x: auto; }

  .clauses { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  @media (max-width: 760px) { .clauses { grid-template-columns: 1fr; } }
  .clause { padding: 14px 16px; }
  .clause + .clause { border-left: 1px solid var(--line); }
  @media (max-width: 760px) { .clause + .clause { border-left: none; border-top: 1px solid var(--line); } }
  .clause .lang-tag { font-family: var(--mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 8px; }
  .clause .original { background: var(--code-bg); }
  .clause p { margin: 0; font-family: var(--serif); font-size: 0.92rem; line-height: 1.6; }
  .clause.src { background: var(--code-bg); }
  .clause[dir="rtl"] p { text-align: right; }
  .prov { font-family: var(--mono); font-size: 0.66rem; color: var(--ink-faint); margin-top: 10px; }

  .note { border-left: 3px solid var(--accent); padding: 10px 14px; background: var(--accent-soft); border-radius: 0 4px 4px 0; margin-bottom: 10px; }
  .note p { margin: 0 0 4px; font-size: 0.86rem; }
  .note .byline { font-family: var(--mono); font-size: 0.66rem; color: var(--ink-faint); }

  .chain { display: flex; gap: 0; flex-wrap: wrap; }
  .chain-step { flex: 1; min-width: 150px; padding: 10px 14px; border: 1px solid var(--line); margin: -1px 0 0 -1px; }
  .chain-step .role { font-family: var(--mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-faint); }
  .chain-step .who { font-weight: 600; font-size: 0.84rem; margin: 3px 0 1px; }
  .chain-step .when { font-size: 0.72rem; color: var(--ink-faint); font-family: var(--mono); }
  .chain-step.agent .who { color: var(--accent-ink); }

  .verrow { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.82rem; flex-wrap: wrap; }
  .verrow:last-child { border-bottom: none; }
  .verrow .v { font-family: var(--mono); font-weight: 500; color: var(--ink); min-width: 60px; }

  /* ---------- workbench ---------- */
  .wb-head h1 { font-family: var(--serif); font-weight: 600; font-size: 1.6rem; margin: 0 0 6px; }
  .wb-head p { margin: 0 0 22px; color: var(--ink-soft); max-width: 62ch; }
  .qcard { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 5px; margin-bottom: 16px; overflow: hidden; }
  .qcard-head { display: flex; align-items: center; gap: 12px; padding: 13px 18px; flex-wrap: wrap; cursor: pointer; }
  .qcard-head:hover { background: var(--accent-soft); }
  .qcard-head .qt { font-weight: 700; font-size: 0.9rem; }
  .qcard-head .qid { font-family: var(--mono); font-size: 0.72rem; color: var(--accent-ink); }
  .qcard-head .maker { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-faint); margin-left: auto; }
  .qbody { border-top: 1px solid var(--line); padding: 16px 18px; display: none; }
  .qcard.open .qbody { display: block; }
  .qsec { margin-bottom: 16px; }
  .qsec h3 { margin: 0 0 8px; font-size: 0.7rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); font-weight: 500; }
  .diff { font-family: var(--mono); font-size: 0.74rem; line-height: 1.6; border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; }
  .diff div { padding: 2px 12px; white-space: pre; }
  .diff .del { background: var(--alert-soft); color: var(--alert); }
  .diff .add { background: var(--accent-soft); color: var(--accent-ink); }
  .diff .ctx { color: var(--ink-faint); }
  .ci-line { font-family: var(--mono); font-size: 0.7rem; color: var(--accent-ink); margin-top: 8px; }

  .comment { border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; margin-bottom: 8px; background: var(--ground); }
  .comment .byline { font-family: var(--mono); font-size: 0.66rem; color: var(--ink-faint); margin-bottom: 4px; }
  .comment p { margin: 0; font-size: 0.85rem; }
  .comment.agent { border-left: 3px solid var(--accent); }
  .comment.human { border-left: 3px solid var(--warn); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px; padding: 7px 14px; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); }
  .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .btn.primary:hover { color: var(--ground); filter: brightness(1.06); }
  .btn.danger:hover { border-color: var(--alert); color: var(--alert); }
  textarea, select {
    font: inherit; font-size: 0.84rem; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 4px; padding: 8px 10px; width: 100%;
  }
  textarea { min-height: 64px; resize: vertical; }
  .regen-panel { border: 1px dashed var(--accent); border-radius: 4px; padding: 14px; margin-top: 12px; background: var(--accent-soft); }
  .regen-panel label { font-size: 0.7rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); display: block; margin: 8px 0 4px; }
  .progress { font-family: var(--mono); font-size: 0.74rem; color: var(--accent-ink); margin-top: 10px; }
  .newdraft { border: 1px solid var(--accent); background: var(--surface); border-radius: 4px; padding: 12px 16px; margin-top: 12px; }
  .newdraft .nd-title { font-weight: 700; font-size: 0.86rem; color: var(--accent-ink); margin-bottom: 4px; }
  .newdraft p { margin: 0 0 6px; font-size: 0.82rem; color: var(--ink-soft); }

  /* ---------- home ---------- */
  .home h1 { font-family: var(--serif); font-weight: 600; font-size: 1.8rem; margin: 0 0 10px; }
  .home .lede { color: var(--ink-soft); max-width: 64ch; margin: 0 0 24px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  .stat .n { font-family: var(--mono); font-size: 1.5rem; font-weight: 500; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); font-family: var(--mono); }
  .how { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .how .panel { margin-bottom: 0; }
  .how .panel p { font-size: 0.84rem; color: var(--ink-soft); margin: 0; }
  .how .panel .step { font-family: var(--mono); font-size: 0.66rem; color: var(--accent-ink); letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 6px; }

  .stub-note { border: 1px dashed var(--line-strong); border-radius: 4px; padding: 16px 20px; color: var(--ink-soft); font-size: 0.88rem; max-width: 60ch; }
  .footer-note { margin-top: 40px; font-family: var(--mono); font-size: 0.66rem; color: var(--ink-faint); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<header class="topbar">
  <div class="wordmark"><span class="jaro">JARO</span><span class="sub">Agentic Reg Ops · llm-wiki</span></div>
  <span class="proto-badge">Concept prototype · illustrative data</span>
  <nav class="topnav" aria-label="Main">
    <button id="nav-wiki" class="active" onclick="go('home')">Wiki</button>
    <button id="nav-wb" onclick="go('workbench')">Checker workbench<span class="count" id="wb-count">3</span></button>
  </nav>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="Jurisdictions">
    <div class="side-label">Jurisdictions · by region</div>
    <div id="tree"></div>
    <div class="side-label" style="margin-top:22px">Legend</div>
    <div style="font-size:0.74rem; color:var(--ink-soft); padding:0 8px; display:grid; gap:5px;">
      <span><span class="dot effective" style="display:inline-block"></span> effective</span>
      <span><span class="dot review" style="display:inline-block"></span> in review</span>
      <span><span class="dot draft" style="display:inline-block"></span> draft / backfill</span>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
// ------------------------------------------------------------------
// Data — illustrative corpus
// ------------------------------------------------------------------
const DATA = {
  regions: [
    { name: "EMEA", countries: [
      { name: "Germany", code: "DE", docs: ["de-z4", "de-z10"] },
      { name: "United Kingdom", code: "GB", docs: ["gb-boe"] },
      { name: "France", code: "FR", docs: ["fr-eco"] },
      { name: "Switzerland", code: "CH", docs: ["ch-snb"] },
      { name: "UAE", code: "AE", docs: ["ae-brf"] },
      { name: "South Africa", code: "ZA", docs: ["za-sarb"] },
    ]},
    { name: "APAC", countries: [
      { name: "Japan", code: "JP", docs: ["jp-bop"] },
      { name: "China", code: "CN", docs: ["cn-safe"] },
      { name: "Hong Kong SAR", code: "HK", docs: ["hk-hkma"] },
      { name: "Korea", code: "KR", docs: ["kr-bok"] },
      { name: "Singapore", code: "SG", docs: ["sg-mas610"] },
      { name: "India", code: "IN", docs: ["in-feters"] },
      { name: "Australia", code: "AU", docs: ["au-ifti", "au-apra"] },
    ]},
    { name: "North America", countries: [
      { name: "United States", code: "US", docs: ["us-ctr"] },
      { name: "Canada", code: "CA", docs: ["ca-fintrac"] },
    ]},
    { name: "Latin America", countries: [
      { name: "Brazil", code: "BR", docs: ["br-fx"] },
      { name: "Mexico", code: "MX", docs: ["mx-banxico"] },
      { name: "Argentina", code: "AR", docs: ["ar-bcra"] },
      { name: "Colombia", code: "CO", docs: ["co-banrep"] },
    ]},
  ],
  docs: {
    "de-z4": {
      full: true, region: "EMEA", country: "Germany",
      id: "gr3:de.bbk.awv-z4", version: "4.2.0", status: "effective",
      title: "External Payments Report (Z4) — Zahlungen im Außenwirtschaftsverkehr",
      langs: "DE → EN",
      facts: [
        ["Regulator", "Deutsche Bundesbank"], ["Legal basis", "AWV §67(1)"],
        ["Report code", "Z4"], ["Channel", "Bundesbank AMS portal"],
        ["Format", "XML · AMS schema v3"], ["Frequency", "Monthly"],
        ["Deadline", "7th calendar day, following month"], ["Threshold", "EUR 12,500"],
        ["Who must report", "Resident entities, incl. bank branches"],
        ["Effective from", "2025-01-01"], ["Review by", "2026-11-01"],
      ],
      triggerProse: "Incoming or outgoing cross-border payments above EUR 12,500 or equivalent, excluding goods invoices settled within 12 months.",
      triggerRule: 'amount_eur > 12500\nand counterparty.country != "DE"\nand "goods_settlement_short_term"\n    not in exemptions',
      contract: [
        ["dict:payment.amount", "pacs.008 …/IntrBkSttlmAmt", "#sec-67"],
        ["dict:counterparty.country", "pacs.008 …/Cdtr/PstlAdr/Ctry", "#sec-67"],
        ["dict:purpose.code", "Bundesbank Kennzahl list", "#annex-lv"],
      ],
      clause: {
        anchor: "src/de/awv-2024.de.pdf#sec-67",
        origLang: "Deutsch (original — evidence)", orig:

const $ = (id) => document.getElementById(id);
let state = { view: "home", doc: null };

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function pillFor(status) {
  const map = { effective: ["effective", "Effective"], review: ["review", "In review"], draft: ["draft", "Draft"], changes: ["changes", "Changes requested"], approved: ["approved", "Approved — four-eyes pending"] };
  const [cls, label] = map[status] || map.draft;
  return `<span class="pill ${cls}">${label}</span>`;
}

function renderTree() {
  $("tree").innerHTML = DATA.regions.map((r, ri) => `
    <details class="region"${ri === 0 ? " open" : ""}>
      <summary>${r.name}<span class="region-count">${r.countries.reduce((n, c) => n + c.docs.length, 0)}</span></summary>
      ${r.countries.map(c => `
        <div class="country">
          <div class="country-head">${c.name}</div>
          ${c.docs.map(d => {
            const doc = DATA.docs[d];
            return `<button class="doc-link${state.doc === d ? " active" : ""}" onclick="go('doc','${d}')">
              <span class="dot ${doc.status}"></span>${doc.id.replace("gr3:", "")}</button>`;
          }).join("")}
        </div>`).join("")}
    </details>`).join("");
}

function go(view, param) {
  state.view = view; state.doc = view === "doc" ? param : null;
  try { history.replaceState(null, "", view === "home" ? "#" : view === "doc" ? "#doc/" + param : "#workbench"); } catch (e) {}
  $("nav-wiki").classList.toggle("active", view !== "workbench");
  $("nav-wb").classList.toggle("active", view === "workbench");
  renderTree();
  if (view === "home") renderHome();
  else if (view === "doc") renderDoc(param);
  else renderWorkbench();
  window.scrollTo({ top: 0 });
}

function renderHome() {
  const all = Object.values(DATA.docs);
  const eff = all.filter(d => d.status === "effective").length;
  const rev = all.filter(d => d.status === "review").length;
  $("main").innerHTML = `
    <div class="home">
      <h1>One portable format. Every jurisdiction. Two kinds of reader.</h1>
      <p class="lede">Every regulatory requirement is one page — a <b>Global Regulatory Requirement Record (GR3)</b> — written once, read by humans as a governed document and by JARO agents as structured data. Agents are the <b>makers</b>; Reg Ops checkers <b>approve everything</b> before it becomes effective. Pick a jurisdiction on the left, or open the checker workbench.</p>
      <div class="stats">
        <div class="stat"><div class="n">${DATA.regions.length}</div><div class="l">regions</div></div>
        <div class="stat"><div class="n">${DATA.regions.reduce((n, r) => n + r.countries.length, 0)}</div><div class="l">jurisdictions</div></div>
        <div class="stat"><div class="n">${all.length}</div><div class="l">records</div></div>
        <div class="stat"><div class="n">${eff}</div><div class="l">effective</div></div>
        <div class="stat"><div class="n">${rev + QUEUE.filter(q => q.status !== "approved").length}</div><div class="l">in review</div></div>
      </div>
      <div class="how">
        <div class="panel"><span class="step">1 · Maker (JARO AI Agents)</span><p>JARO agents scan regulators, extract requirements from the original language, translate, map data elements, and encode rules — every draft cites its source clause.</p></div>
        <div class="panel"><span class="step">2 · Checker (Reg Ops)</span><p>Country SMEs review drafts in the workbench: read the diff and the anchored clauses, then approve — or leave feedback and send it back.</p></div>
        <div class="panel"><span class="step">3 · Regenerate on feedback</span><p>Comments become instructions: ask JARO to regenerate reg reports, RFI responses, audit packs, or ad hoc extracts with the feedback applied.</p></div>
        <div class="panel"><span class="step">4 · Serve from the RKB</span><p>Approved records compile into the Regulatory Knowledge Base — everything downstream cites <span class="chip">gr3@version#clause</span>.</p></div>
      </div>
      <p class="footer-note">JARO llm-wiki · concept prototype · all regulatory content is illustrative and abbreviated — not legal guidance</p>
    </div>`;
}

function renderDoc(key) {
  const d = DATA.docs[key];
  if (!d.full) {
    $("main").innerHTML = `
      <div class="crumb">${d.region} / <b>${d.country}</b></div>
      <div class="doc-head">
        <h1>${d.title}</h1>
        <div class="idrow"><span class="gr3-id">${d.id}@${d.version}</span>${pillFor(d.status)}<span class="chip">${d.langs}</span></div>
      </div>
      <div class="stub-note"><b>Condensed record.</b> ${d.stub} In the full system every record renders like the flagship pages — try <a href="#" onclick="go('doc','de-z4');return false;">Germany Z4</a>, <a href="#" onclick="go('doc','jp-bop');return false;">Japan BOP</a>, or <a href="#" onclick="go('doc','ae-brf');return false;">UAE BRF</a>.</div>`;
    return;
  }
  const human = `
    <div class="panel"><h2>Obligation — facts (frontmatter plane)</h2>
      <dl class="facts">${d.facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    </div>
    <div class="panel"><h2>Trigger — two planes, kept in sync</h2>
      <div class="planes">
        <div class="plane"><h3>Prose (for humans &amp; RFIs)</h3><p>${d.triggerProse}</p></div>
        <div class="plane"><h3>Rule twin (for generation &amp; validation)</h3><pre>${esc(d.triggerRule)}</pre></div>
      </div>
      <div class="sync-note">✓ CI prose/rule consistency check passed</div>
    </div>
    <div class="panel"><h2>Data contract</h2>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Element</th><th>Maps to</th><th>Source anchor</th></tr></thead>
        <tbody>${d.contract.map(([e, m, a]) => `<tr><td class="k"><span class="chip">${e}</span></td><td>${m}</td><td><span class="chip anchor">${a}</span></td></tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="panel"><h2>Source clause — original is evidence, translation is interpretation</h2>
      <div class="clauses">
        <div class="clause src" ${d.clause.dir === "rtl" ? 'dir="rtl"' : ""}><div class="lang-tag" dir="ltr">${d.clause.origLang}</div><p lang="">${d.clause.orig}</p></div>
        <div class="clause"><div class="lang-tag">${d.clause.enLang || "English (aligned translation)"}</div><p>${d.clause.en}</p></div>
      </div>
      <div class="prov">anchor: <span class="chip anchor">${d.clause.anchor}</span> · ${d.clause.prov}</div>
    </div>
    <div class="panel"><h2>Interpretation notes</h2>
      ${d.notes.map(n => `<div class="note"><p>${n.text}</p><div class="byline">${n.by}</div></div>`).join("")}
    </div>
    <div class="panel"><h2>Approval chain — maker / checker / four-eyes</h2>
      <div class="chain">${d.chain.map(s => `<div class="chain-step${s.agent ? " agent" : ""}"><div class="role">${s.role}</div><div class="who">${s.who}</div><div class="when">${s.when}</div></div>`).join("")}</div>
    </div>
    <div class="panel"><h2>Versions — both clocks preserved</h2>
      ${d.versions.map(([v, txt, st]) => `<div class="verrow"><span class="v">${v}</span>${pillFor(st)}<span style="color:var(--ink-soft)">${txt}</span></div>`).join("")}
    </div>`;

  const agent = `
    <div class="panel"><h2>The same page, as agents read it — raw portable format</h2>
      <pre>---
gr3: ${d.id}@${d.version}
type: gr3.record
jurisdiction: ${d.country}
status: ${d.status === "effective" ? "effective" : "in_review"}
obligation:
  trigger:
    prose: >
      ${d.triggerProse}
    rule: |
${d.triggerRule.split("\n").map(l => "      " + esc(l)).join("\n")}
data_contract:
${d.contract.map(([e]) => `  - element: ${e}`).join("\n")}
legal_basis:
  - source: ${d.clause.anchor}
---
## Interpretation notes
${d.notes[0].text}</pre>
    </div>
    <div class="panel"><h2>How JARO agents consume it</h2>
      <div class="planes">
        <div class="plane"><h3>Governed fetch (structured facts)</h3>
          <pre>rec = jaro.pull_gr3(
  "${d.id}",
  as_of_effective="2026-08-01")
# → parsed frontmatter; only
#   approved+effective is served</pre></div>
        <div class="plane"><h3>Evaluate the rule twin</h3>
          <pre>verdict = jaro.evaluate_trigger(
  rec, txn)   # in scope? why?
# every call emits a signed
# governance event (JARO runtime)</pre></div>
        <div class="plane"><h3>Cited retrieval from the RKB</h3>
          <pre>ans = rkb.query(
  "threshold for ${d.country}?",
  cite=True)
# → text + [{gr3, version,
#     anchor, quote, lang}]</pre></div>
        <div class="plane"><h3>Guardrails on the way out</h3>
          <pre># drafts pass grounding +
# PII guardrails; unanchored
# claims are rejected before
# any human ever sees them</pre></div>
      </div>
    </div>`;

  $("main").innerHTML = `
    <div class="crumb">${d.region} / <b>${d.country}</b> / ${d.id}</div>
    <div class="doc-head">
      <h1>${d.title}</h1>
      <div class="idrow">
        <span class="gr3-id">${d.id}@${d.version}</span>${pillFor(d.status)}<span class="chip">${d.langs}</span>
        <div class="view-toggle" role="tablist">
          <button id="vt-h" class="on" onclick="setView('h')">Human view</button>
          <button id="vt-a" onclick="setView('a')">Agent view</button>
        </div>
      </div>
    </div>
    <div id="dv-h">${human}</div>
    <div id="dv-a" style="display:none">${agent}</div>`;
}

function setView(which) {
  $("dv-h").style.display = which === "h" ? "" : "none";
  $("dv-a").style.display = which === "a" ? "" : "none";
  $("vt-h").classList.toggle("on", which === "h");
  $("vt-a").classList.toggle("on", which === "a");
}

// ------------------------------------------------------------------
// Workbench
// ------------------------------------------------------------------
function renderWorkbench() {
  $("main").innerHTML = `
    <div class="wb-head">
      <h1>Checker workbench</h1>
      <p>Everything here was <b>made by JARO agents</b> and is waiting on a human. Approve it, or leave feedback and ask JARO to regenerate — reg reports, RFI responses, audit packs, or ad hoc extracts.</p>
    </div>
    <div id="queue">${QUEUE.map(qcardHTML).join("")}</div>
    <div class="wb-head" style="margin-top:34px"><h1 style="font-size:1.2rem">Recent JARO outputs</h1>
      <p>Approved and delivered — kept here because any of them can be regenerated when facts or feedback change.</p></div>
    ${OUTPUTS.map(o => `
      <div class="qcard"><div class="qcard-head" style="cursor:default">
        <span class="qt">${o.title}</span><span class="pill ${o.pill}">${o.label}</span>
        <span class="maker">${o.meta}</span>
      </div></div>`).join("")}
    <p class="footer-note">Maker–checker is enforced by runtime policy: JARO agents cannot approve, merge, or file. Only checker + four-eyes approval makes a record effective.</p>`;
  updateCount();
}

function qcardHTML(q) {
  return `
  <div class="qcard" id="${q.id}">
    <div class="qcard-head" onclick="toggleCard('${q.id}')">
      <span class="qt">${q.title}</span>
      <span class="chip">${q.kind}</span>
      ${pillFor(q.status)}
      <span class="maker">maker: ${q.maker}</span>
    </div>
    <div class="qbody">
      <div class="qsec"><h3>What changed</h3>
        <p style="margin:0 0 10px; font-size:0.86rem;">${q.summary}</p>
        <div style="font-family:var(--mono); font-size:0.7rem; color:var(--accent-ink); margin-bottom:8px;">${q.gr3}</div>
        ${q.diff ? `<div class="diff">${q.diff.map(([c, l]) => `<div class="${c}">${esc(l)}</div>`).join("")}</div>` : ""}
        ${q.excerpt ? `<div class="note"><p>${q.excerpt}</p><div class="byline">draft excerpt — every claim carries a citation</div></div>` : ""}
        <div class="ci-line">${q.ci}</div>
      </div>
      <div class="qsec"><h3>Comments &amp; feedback</h3>
        <div id="${q.id}-comments">${q.comments.map(commentHTML).join("") || '<p style="font-size:0.8rem;color:var(--ink-faint);margin:0">No comments yet.</p>'}</div>
      </div>
      <div class="qsec actions">
        <button class="btn primary" onclick="approve('${q.id}')">Approve as checker</button>
        <button class="btn danger" onclick="toggleFeedback('${q.id}')">Request changes / comment</button>
        <button class="btn" onclick="toggleRegen('${q.id}')">Ask JARO to regenerate…</button>
        <span style="font-family:var(--mono); font-size:0.66rem; color:var(--ink-faint)">four-eyes co-sign required before effective</span>
      </div>
      <div id="${q.id}-feedback" style="display:none">
        <label style="font-size:0.7rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);display:block;margin-bottom:4px">Your feedback (recorded on the thread, feeds regeneration)</label>
        <textarea id="${q.id}-fb-text" placeholder="e.g. Corridor granularity should be emirate-level for GCC…"></textarea>
        <div style="margin-top:8px"><button class="btn" onclick="submitFeedback('${q.id}')">Add comment &amp; request changes</button></div>
      </div>
      <div id="${q.id}-regen" style="display:none" class="regen-panel">
        <b style="font-size:0.84rem">Regenerate with JARO</b>
        <label for="${q.id}-regen-type">What should JARO regenerate?</label>
        <select id="${q.id}-regen-type">${q.regen.map(r => `<option>${r}</option>`).join("")}</select>
        <label for="${q.id}-regen-instr">Instruction to the agents (prefilled from latest feedback)</label>
        <textarea id="${q.id}-regen-instr">${latestHumanComment(q)}</textarea>
        <div style="margin-top:10px"><button class="btn primary" onclick="runRegen('${q.id}')">Send to JARO</button></div>
        <div id="${q.id}-progress"></div>
      </div>
    </div>
  </div>`;
}

function commentHTML(c) {
  return `<div class="comment ${c.cls}"><div class="byline">${c.who} · ${c.when}</div><p>${c.text}</p></div>`;
}

function latestHumanComment(q) {
  const h = [...q.comments].reverse().find(c => c.cls === "human");
  return h ? h.text : "";
}

function toggleCard(id) { $(id).classList.toggle("open"); }
function toggleFeedback(id) { const el = $(id + "-feedback"); el.style.display = el.style.display === "none" ? "" : "none"; }
function toggleRegen(id) { const el = $(id + "-regen"); el.style.display = el.style.display === "none" ? "" : "none"; }

function updateCount() {
  $("wb-count").textContent = QUEUE.filter(q => q.status === "review" || q.status === "changes").length;
}

function approve(id) {
  const q = QUEUE.find(x => x.id === id);
  q.status = "approved";
  q.comments.push({ who: "sme.you (checker)", cls: "human", when: "just now", text: "Approved as checker. Routed to four-eyes (regops.lead) for co-sign; becomes effective on the calendar date after co-sign." });
  rerenderCard(q);
}

function submitFeedback(id) {
  const q = QUEUE.find(x => x.id === id);
  const text = $(id + "-fb-text").value.trim();
  if (!text) return;
  q.status = "changes";
  q.comments.push({ who: "sme.you (checker)", cls: "human", when: "just now", text });
  rerenderCard(q, { openRegen: true });
}

function rerenderCard(q, opts = {}) {
  const wasOpen = $(q.id).classList.contains("open");
  $(q.id).outerHTML = qcardHTML(q);
  if (wasOpen) $(q.id).classList.add("open");
  if (opts.openRegen) $(q.id + "-regen").style.display = "";
  updateCount();
}

function runRegen(id) {
  const q = QUEUE.find(x => x.id === id);
  const type = $(id + "-regen-type").value;
  const instr = $(id + "-regen-instr").value.trim();
  const prog = $(id + "-progress");
  const steps = [
    "policy check — agent may draft, not approve ✓",
    "rendering jurisdiction prompt (versioned) ✓",
    "drafting " + type.toLowerCase() + " …",
    "guardrails: grounding + PII ✓ · governance event emitted ✓",
  ];
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let out = [];
  const finish = () => {
    prog.innerHTML = `<div class="progress">${out.join("<br>")}</div>
      <div class="newdraft">
        <div class="nd-title">New draft ready — awaiting checker approval</div>
        <p><b>${type}</b> regenerated by jaro fleet · cites ${q.gr3.split("·")[0].trim()}</p>
        ${instr ? `<p>Addressed feedback: “${esc(instr)}”</p>` : ""}
        <p style="font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint)">status: draft · invisible to RKB and filings until you approve · governance event 7d1f…e33</p>
      </div>`;
  };
  if (reduced) { out = steps; finish(); return; }
  prog.innerHTML = "";
  steps.forEach((s, i) => {
    setTimeout(() => {
      out.push(s);
      prog.innerHTML = `<div class="progress">${out.join("<br>")}</div>`;
      if (i === steps.length - 1) setTimeout(finish, 350);
    }, 420 * (i + 1));
  });
}

const boot = location.hash.slice(1);
if (boot === "workbench") go("workbench");
else if (boot.startsWith("doc/") && DATA.docs[boot.slice(4)]) go("doc", boot.slice(4));
else { renderTree(); renderHome(); }
</script>
